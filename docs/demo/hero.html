<!doctype html>
<!-- The README's banner (docs/assets/hero.png): Suda's own icon and colours beside two real screenshots of the demo
     board (docs/demo/capture.py --hero takes them into docs/demo/out/ and photographs this page at 1280 by 600). -->
<html lang="en"><head><meta charset="utf-8"><title>Suda</title>
<style>
  html,body{margin:0;width:1280px;height:600px;overflow:hidden}
  body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#f7f0f8;
    background:radial-gradient(900px 520px at 78% 18%,#6a2f63 0%,rgba(106,47,99,0) 70%),linear-gradient(135deg,#3b1e3f 0%,#24132a 60%,#1a0f1e 100%)}
  .left{position:absolute;left:64px;top:92px;width:490px}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:76px;height:76px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  h1{margin:0;font-size:72px;line-height:1;letter-spacing:-1.5px;font-weight:800}
  .tag{margin:30px 0 0;font-size:35px;line-height:1.16;letter-spacing:-.6px;font-weight:800}
  .tag em{font-style:normal;color:#ff7aa0}
  .sub{margin:18px 0 0;font-size:19px;color:#dcc9e0}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .chips span{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:15px;font-weight:600}
  .desk{position:absolute;left:560px;top:70px;width:640px;border-radius:12px;overflow:hidden;background:#fff;
    box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12)}
  .bar{height:26px;background:#ece7ee;display:flex;align-items:center;gap:7px;padding:0 12px}
  .bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.bar i+i{background:#febc2e}.bar i+i+i{background:#28c840}
  .desk img{display:block;width:640px}
  .phone{position:absolute;left:1036px;top:208px;width:196px;padding:8px;border-radius:30px;background:#0d0a0f;
    box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.15)}
  .phone img{display:block;width:196px;border-radius:22px}
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../../icons/suda-512.png" alt=""><h1>Suda</h1></div>
    <p class="tag">A topic is not an agent.<br><em>One thread per topic, whoever does the work.</em></p>
    <p class="sub">Whose turn it is, always in sight. Answer from your phone in one tap.</p>
    <div class="chips"><span>Any models, any orchestration</span><span>Phone and desktop</span><span>Runs on your machine</span></div>
  </div>
  <div class="desk"><div class="bar"><i></i><i></i><i></i></div><img src="out/hero-desk.png" alt=""></div>
  <div class="phone"><img src="out/hero-phone.png" alt=""></div>
</body></html>
