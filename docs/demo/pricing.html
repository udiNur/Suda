<!doctype html><html><head><meta charset="utf-8"><title>Pricing page mock-up</title>
<style>body{font:15px system-ui;margin:0;padding:16px;background:#f6f7fb;color:#1d2433}h1{font-size:19px;margin:0 0 4px}p{margin:0 0 12px;color:#5a6477}
.row{display:flex;gap:10px}.card{flex:1;background:#fff;border:1px solid #dfe3ec;border-radius:12px;padding:12px;cursor:pointer}
.card.on{border-color:#4b6bfb;box-shadow:0 0 0 2px #4b6bfb33}.price{font-size:24px;font-weight:700}.small{font-size:12px;color:#5a6477}
button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:10px;background:#4b6bfb;color:#fff;font:inherit;font-weight:600}
.sw{display:inline-flex;background:#e7eaf3;border-radius:999px;padding:3px;margin-bottom:12px}.sw span{padding:4px 12px;border-radius:999px;cursor:pointer}.sw .on{background:#fff}</style></head>
<body><h1>Simple pricing</h1><p>Tap a plan, switch the billing period.</p>
<div class="sw"><span id="m" class="on">Monthly</span><span id="y">Yearly</span></div>
<div class="row"><div class="card" data-p="9"><b>Starter</b><div class="price">$9</div><div class="small">3 projects</div></div>
<div class="card on" data-p="29"><b>Team</b><div class="price">$29</div><div class="small">Unlimited projects</div></div></div>
<button id="go">Start with Team</button>
<script>let yearly=false;const cards=[...document.querySelectorAll('.card')];
function draw(){cards.forEach(c=>{const p=+c.dataset.p;c.querySelector('.price').textContent='$'+(yearly?Math.round(p*10):p)});
document.getElementById('m').className=yearly?'':'on';document.getElementById('y').className=yearly?'on':'';}
cards.forEach(c=>c.onclick=()=>{cards.forEach(x=>x.classList.remove('on'));c.classList.add('on');document.getElementById('go').textContent='Start with '+c.querySelector('b').textContent;});
document.getElementById('m').onclick=()=>{yearly=false;draw()};document.getElementById('y').onclick=()=>{yearly=true;draw()};</script></body></html>
