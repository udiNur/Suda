name: Bug report
description: Something in Suda does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **A security problem does not belong here**: report it privately, as
        [SECURITY.md](https://github.com/udiNur/Suda/blob/main/SECURITY.md) explains.
        Leave out anything private from your board (names, hosts, addresses, tokens).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the output of `git rev-parse --short HEAD` in your clone.
      placeholder: "v0.1.0 or 1a2b3c4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: The output of `python3 --version`.
      placeholder: "Python 3.12.8"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Where the page runs, if the bug is in the page.
      placeholder: "Safari on iPhone, Chrome 131 on desktop, not the page (CLI)"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran (`threads ...`) and what you did on the page. A demo board (`python3 docs/demo/demo.py`) is best.
      placeholder: |
        1. python3 docs/demo/demo.py
        2. Open the thread "Release 2.4"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead. Error output and screenshots help.
    validations:
      required: true
