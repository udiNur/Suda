<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3b1e3f">
<meta name="referrer" content="no-referrer">
<title>MD Viewer</title>
<link rel="stylesheet" href="static/suda.css">
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<!--@@ICONS@@-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></symbol>
  <symbol id="i-translate" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h8M6.5 3v1.5M4 4.5c.6 2.8 2.4 4.8 5 6M9 4.5c-.6 2.8-2.4 4.8-5 6M10.5 17l3.2-8 3.3 8M11.6 14.3h4.2"/></symbol>
  <symbol id="i-sum" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h12M4 9h8M4 13h10M4 17h6"/><path d="M15.5 12.5l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5z"/></symbol>
  <symbol id="i-keys" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="5" width="16" height="10" rx="2"/><path d="M5 8.5h1M8 8.5h1M11 8.5h1M14 8.5h1M6 11.5h8"/></symbol>
  <symbol id="i-width" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10h15M5.5 7l-3 3 3 3M14.5 7l3 3-3 3"/></symbol>
</svg>

<div class="app in-chat" id="app">
  <main class="chat" id="chat">
    <div class="pane">
      <header class="head">
        <div class="head-main">
          <div class="head-title"><span class="slot lang" id="h-slot"></span><h2 id="h-title" dir="auto"></h2><span class="tid" id="h-path"></span></div>
          <div class="head-status" id="h-status"></div>
        </div>
        <div class="head-acts" id="head-acts">
          <button class="icon" id="b-find" type="button" title="Search in the file (/)" aria-label="Search in the file" data-t-attrs="title aria-label"><svg><use href="#i-search"/></svg></button>
          <button class="icon" id="b-sum" type="button" title="Summary (S)" aria-label="Summary" data-t-attrs="title aria-label"><svg><use href="#i-sum"/></svg></button>
          <button class="icon" id="b-tr" type="button" title="Translation (T)" aria-label="Translation" data-t-attrs="title aria-label"><svg><use href="#i-translate"/></svg></button>
          <button class="icon" id="b-more" type="button" title="More" aria-label="More" data-t-attrs="title aria-label"><svg><use href="#i-more"/></svg></button>
        </div>
        <div class="head-acts" id="head-embed" hidden>
          <button class="icon" id="b-back" type="button" title="Back to the previous file" aria-label="Back to the previous file" data-t-attrs="title aria-label" hidden><svg><use href="#i-right"/></svg></button>
          <a class="icon" id="b-newpage" target="_blank" rel="noopener" title="Open in a new page" aria-label="Open in a new page" data-t-attrs="title aria-label"><svg><use href="#i-link"/></svg></a>
          <button class="icon" id="b-size" type="button" title="Full screen" aria-label="Full screen" data-t-attrs="title aria-label" aria-pressed="false" hidden><svg><use href="#i-expand"/></svg></button>
          <button class="icon" id="b-close" type="button" title="Close (Esc)" aria-label="Close" data-t-attrs="title aria-label"><svg><use href="#i-x"/></svg></button>
        </div>
      </header>
      <div class="find" id="find" hidden>
        <input id="find-q" dir="auto" placeholder="Search this file" data-t-attrs="placeholder" autocomplete="off" spellcheck="false">
        <span class="find-count" id="find-count">0/0</span>
        <button class="icon" id="find-prev" type="button" aria-label="Previous" data-t-attrs="aria-label"><svg width="18" height="18"><use href="#i-up"/></svg></button>
        <button class="icon" id="find-next" type="button" aria-label="Next" data-t-attrs="aria-label"><svg width="18" height="18"><use href="#i-down"/></svg></button>
        <button class="icon" id="find-x" type="button" aria-label="Close" data-t-attrs="aria-label"><svg width="18" height="18"><use href="#i-x"/></svg></button>
      </div>
      <div class="xbar" id="xbar" hidden></div>
      <div class="doc-scroll" id="scroll"><div id="sum-slot"></div><div class="doc" id="doc"></div></div>
    </div>
  </main>
</div>

<div class="overlay" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" style="max-height:80vh">
    <div class="dialog-top"><h2 id="m-title"></h2><button class="icon" id="m-x" type="button" aria-label="Close" data-t-attrs="aria-label"><svg width="18" height="18"><use href="#i-x"/></svg></button></div>
    <div id="m-body" style="overflow:auto;padding:12px 16px 16px"></div>
  </div>
</div>

<div id="float-toasts" class="toasts" data-at="top-center"></div>
<div class="menu-pop" id="menu" hidden></div>

<script src="static/vendor/mermaid.min.js" defer></script>
<script src="static/l10n.js"></script>
<script src="static/suda-pure.js"></script>
<script src="static/mdv-pure.js"></script>
<script src="static/app.js"></script>
</body>
</html>
